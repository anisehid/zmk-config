# Built on upstream ZMK with this repo's boards (boards/anisehid/) as a Zephyr
# module. Left halves carry ZMK Studio (https://zmk.studio); unlock is Fn3+Esc
# on the 85-series and Fn2+LShift+Backspace on the 60-series.
#
# Hardware-verified: anise85a on anisectlc (2026-09-26). Everything else
# builds but is untested, including the whole anisectlp board port.
# anise85n has no Studio: its transform disagrees with AniseHID's layout
# description (see tools/make_layouts.py).
---
include:
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_right
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_win_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_win_right
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_mac_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_mac_right
  - board: anisectlc/nrf52840/zmk
    shield: anise60b_vim_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: anisectlc/nrf52840/zmk
