# CONFIG_ZMK_USB_LOGGING=y
# Uncomment the following lines to enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP no longer exists; Zephyr 4.x selects the WS2812
# driver from the devicetree compatible instead.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=180
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# P0.09/P0.10 are NFC antenna pins at reset and cannot drive the matrix
# until freed. anisectlc routes row 4 through P0.09, anisectlp column 1.
CONFIG_NFCT_PINS_AS_GPIOS=y
